services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: AccademyDb
      POSTGRES_USER: academy
      POSTGRES_PASSWORD: academy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academy -d AccademyDb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
